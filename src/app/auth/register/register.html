<div class="login-page">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
        <path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.5l-6.3 4.5 2.3-7.2-6-4.6h7.6z"/>
      </svg>
    </div>

    <h2>Créer un compte</h2>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </span>
        <input
          type="text"
          name="username"
          placeholder="Nom d'utilisateur"
          [(ngModel)]="username"
          required
          minlength="3"
          #usernameField="ngModel"
        />
      </div>

      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 6 9-6"/></svg>
        </span>
        <input
          type="email"
          name="email"
          placeholder="Email"
          [(ngModel)]="email"
          required
          email
          #emailField="ngModel"
        />
      </div>
      <div class="field-error" *ngIf="emailField.invalid && emailField.touched">
        Veuillez saisir une adresse email valide.
      </div>

      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <input
          type="password"
          name="password"
          placeholder="Mot de passe"
          [(ngModel)]="password"
          required
          minlength="8"
          pattern="^(?=.*[A-Z])(?=.*[^a-zA-Z0-9]).{8,}$"
          #passwordField="ngModel"
        />
      </div>
      <div class="field-error" *ngIf="passwordField.invalid && passwordField.touched">
        Le mot de passe doit contenir au moins 8 caractères, une majuscule et un symbole.
      </div>

      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <input
          type="password"
          name="confirmPassword"
          placeholder="Confirmer le mot de passe"
          [(ngModel)]="confirmPassword"
          required
          #confirmPasswordField="ngModel"
        />
      </div>
      <div class="field-error" *ngIf="confirmPasswordField.touched && password !== confirmPassword">
        Les mots de passe ne correspondent pas.
      </div>

      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid || password !== confirmPassword">S'inscrire</button>
    </form>

    <p class="switch-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
