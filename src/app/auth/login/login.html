<div class="login-page">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
        <path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.5l-6.3 4.5 2.3-7.2-6-4.6h7.6z"/>
      </svg>
    </div>

    <h2>Connexion</h2>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </span>
        <input
          type="text"
          name="username"
          placeholder="Nom d'utilisateur"
          [(ngModel)]="username"
          required
          #usernameField="ngModel"
        />
      </div>

      <div class="input-group">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <input
          type="password"
          name="password"
          placeholder="Mot de passe"
          [(ngModel)]="password"
          required
          #passwordField="ngModel"
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
    </form>

    <p class="switch-link">
      Pas encore de compte ? <a routerLink="/register">Créer un compte</a>
    </p>
  </div>
</div>
